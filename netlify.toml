[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` levanta Vite (frontend) y las Functions reales en un solo puerto.
# El frontend en http://localhost:8888 y la función de tokens en /api/token.
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
